<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С днём рождения, Муж! ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #fff8f4, #f8e9e4);
      color: #292323;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,0.94);
      border-radius: 28px;
      padding: 42px 28px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(70, 35, 35, 0.14);
    }

    .heart {
      font-size: 42px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 26px;
      font-size: 32px;
      line-height: 1.2;
      font-weight: 700;
    }

    .subtitle {
      font-size: 18px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #8d6660;
      margin-bottom: 30px;
    }

    .message {
      font-size: 19px;
      line-height: 1.65;
      margin: 0;
    }

    .tires {
      font-size: 34px;
      letter-spacing: 7px;
      margin: 28px 0;
    }

    .ending {
      margin-top: 30px;
      font-size: 20px;
      line-height: 1.55;
      font-weight: 600;
    }

    .love {
      margin-top: 30px;
      font-size: 25px;
      font-weight: 700;
    }

    .small {
      margin-top: 28px;
      color: #9a8580;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">❤️</div>

    <h1>С днём рождения, Муж!</h1>

    <div class="subtitle">
      Ты только что отсканировал свой подарок
    </div>

    <p class="message">
      Дарю тебе комплект зимних шин!
    </p>

    <div class="tires">
      🛞 🛞 🛞 🛞
    </div>

    <p class="message">
      Они уже оплачены и ждут тебя в пункте выдачи Wildberries.
    </p>

    <p class="ending">
      Так что теперь нам предстоит небольшое совместное приключение:
      приехать, всё проверить и забрать твой подарок.
    </p>

    <div class="love">
      Я люблю тебя ❤️
    </div>


  </div>

</body>
</html>
